<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The visual gate's fonts (e2e/gates/visual.spec.ts): the Playwright Linux
  image resolves `system-ui` and `sans-serif` to a CJK face by default. Pin
  the Latin faces it ships (Liberation, metric-compatible with Arial and
  Courier New), so baselines look like a Linux or Windows reader's page and
  stay identical between a local run and CI. Installed as /etc/fonts/local.conf.
-->
<fontconfig>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>ui-sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias binding="strong"><family>ui-monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
</fontconfig>
