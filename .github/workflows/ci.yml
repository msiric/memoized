name: CI

permissions:
  contents: read

env:
  COREPACK_ENABLE_AUTO_PIN: '0'

on:
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: 'yarn'

      - name: Enable the declared package manager
        run: |
          corepack enable
          node --version
          corepack --version
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn lint

      - name: Run type check
        run: yarn typecheck

      - name: Check the pinned deployment CLI on Node24
        run: |
          version=$(node .github/scripts/deploy-vercel.mjs --cli-version)
          npm install --prefix "$RUNNER_TEMP/vercel-cli" --no-package-lock --no-save --engine-strict "vercel@$version"
          node "$RUNNER_TEMP/vercel-cli/node_modules/vercel/dist/index.js" --version
        env:
          VERCEL_TELEMETRY_DISABLED: '1'

      - name: Run tests
        run: yarn test:check
        env:
          RESEND_TOKEN: re_disabled_unit_test_key
          # Tests mock Prisma; a dummy URL keeps prod credentials out of PR CI.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/memoized_ci?schema=public

  viz-gates:
    name: Visualization gates
    # VIZ-H G: every visual is held to the same gates (README "Gates" in
    # src/components/visualizations). Runs in the Playwright image the visual
    # baselines were rendered in, so screenshots compare byte for byte.
    #
    # The gates run against `next dev`, not a production build: the gallery,
    # specimen, stress and lesson-context pages are dev-only routes that never
    # touch the database, while `next build` needs a migrated, seeded
    # database for the course pages' generateStaticParams (the build job
    # covers production). Dev mode also reports React hydration mismatches,
    # which the gates fail on.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      # Dummy values (no service is called by the dev-only routes).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/memoized_ci?schema=public
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/memoized_ci?schema=public
      NEXT_PUBLIC_SITE_URL: https://memoized.dev
      MEILISEARCH_HOST: http://localhost:7700
      MEILISEARCH_MASTER_KEY: dummy-key-for-ci-build
      RESEND_TOKEN: re_dummy_key_for_ci_build
      NEXTAUTH_SECRET: dummy-nextauth-secret-for-ci
      NEXTAUTH_URL: http://127.0.0.1:3100
      SENTRY_DISABLE: true
      NEXT_TELEMETRY_DISABLED: '1'
      VIZ_GALLERY: '1'
      VIZ_VISUAL: '1'
      E2E_BASE_URL: http://127.0.0.1:3100
      STRESS_OUT: ${{ github.workspace }}/test-results/stress
      MOTION_OUT: ${{ github.workspace }}/test-results/motion
    steps:
      - uses: actions/checkout@v7

      # No setup-node yarn cache here: the image ships neither yarn nor
      # corepack (its own Node is newer), so yarn exists only after
      # corepack is enabled on the Node 24 that setup-node installs.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Enable the declared package manager
        run: |
          corepack enable
          node --version
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check the image matches the Playwright in the lockfile
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          test "$version" = 1.64.1 || { echo "Playwright is $version: update the container image tag and the visual baselines"; exit 1; }

      - name: Pin the gate fonts
        run: cp e2e/gates/fonts.conf /etc/fonts/local.conf && fc-match system-ui

      - name: Start the dev server
        run: |
          nohup node node_modules/next/dist/bin/next dev --hostname 127.0.0.1 --port 3100 > "$RUNNER_TEMP/next-dev.log" 2>&1 &
          node e2e/warm.mjs "$E2E_BASE_URL"

      - name: Visualization gates (PR tier)
        run: e2e/gate.sh pr

      - name: Upload gate evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: viz-gates
          path: |
            test-results
            ${{ runner.temp }}/next-dev.log
          if-no-files-found: ignore

  build:
    name: Build Check
    runs-on: ubuntu-latest
    # An ephemeral Postgres, migrated fresh from the PR's own migrations. Build
    # Check must never run migrations against production — schema changes reach
    # prod only via the deploy workflow on merge to master.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: memoized_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/memoized_ci?schema=public
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/memoized_ci?schema=public
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: 'yarn'

      - name: Enable the declared package manager and record writer runtime
        run: |
          corepack enable
          node --version
          corepack --version
          yarn --version
          echo "NODE24_BIN=$(command -v node)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn generate

      - name: Prepare isolated reader layout fixtures
        run: |
          yarn migrate
          node --import tsx src/scripts/seed-reader-layout.ts
        env:
          READER_LAYOUT_FIXTURE: '1'
          READER_LAYOUT_REPORT_DIR: ${{ runner.temp }}/reader-layout

      - name: Build
        run: yarn build
        env:
          NEXT_PUBLIC_SITE_URL: https://memoized.dev
          MEILISEARCH_HOST: http://localhost:7700
          MEILISEARCH_MASTER_KEY: dummy-key-for-ci-build
          RESEND_TOKEN: re_dummy_key_for_ci_build
          NEXTAUTH_SECRET: dummy-nextauth-secret-for-ci
          NEXTAUTH_URL: https://memoized.dev
          SENTRY_DISABLE: true
          CI: true

      - name: Check real reader layout
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3014 > "$RUNNER_TEMP/reader-layout/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3014/courses/js-track/core-fundamentals/data-types > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          node --import tsx src/scripts/check-reader-layout.ts "$RUNNER_TEMP/reader-layout/config.json"
          node --import tsx src/scripts/check-guided-path.ts on
          node --import tsx src/scripts/check-guided-path-state.ts on
          node --import tsx src/scripts/check-lesson-rendering.ts on
          kill "$server_pid"
          if wait "$server_pid"; then
            :
          else
            exit_code=$?
            test "$exit_code" -eq 143
          fi
          G4_TS_FIRST_PASS_ENABLED=false node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3014 >> "$RUNNER_TEMP/reader-layout/server.log" 2>&1 &
          server_pid=$!
          ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3014/courses/js-track/core-fundamentals/data-types > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          node --import tsx src/scripts/check-guided-path.ts off
          node --import tsx src/scripts/check-lesson-rendering.ts off
        env:
          NEXT_PUBLIC_SITE_URL: https://memoized.dev
          MEILISEARCH_HOST: http://localhost:7700
          MEILISEARCH_MASTER_KEY: dummy-key-for-ci-build
          RESEND_TOKEN: re_dummy_key_for_ci_build
          NEXTAUTH_SECRET: dummy-nextauth-secret-for-ci
          NEXTAUTH_URL: http://127.0.0.1:3014
          SENTRY_DISABLE: true
          G4_TS_FIRST_PASS_ENABLED: 'true'
          READER_LAYOUT_FIXTURE: '1'
          # Placeholder for the publish refresh endpoint; not a real credential.
          REVALIDATE_SECRET: dummy-revalidate-secret-for-ci-000000000000
          READER_LAYOUT_REPORT_DIR: ${{ runner.temp }}/reader-layout

      # Opt in with this PR label before a new push. A second production
      # build is deliberately not charged to every ordinary PR.
      - name: Set up the previous production runtime for recovery coverage
        if: contains(github.event.pull_request.labels.*.name, 'g4-old-reader')
        uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          package-manager-cache: false

      - name: Check pinned old reader against new writer (opt-in)
        if: contains(github.event.pull_request.labels.*.name, 'g4-old-reader')
        timeout-minutes: 20
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/g4-old-reader"
          echo "G4 compatibility: preparing pinned baseline"
          git fetch --no-tags origin "$G4_OLD_READER_SHA"
          git worktree add --detach "$baseline" "$G4_OLD_READER_SHA"
          test "$(git -C "$baseline" rev-parse HEAD)" = "$G4_OLD_READER_SHA"
          cmp prisma/schema.prisma "$baseline/prisma/schema.prisma"
          for name in .env .env.local .env.production .env.production.local prisma/.env; do
            test ! -e "$baseline/$name"
          done
          echo "G4 compatibility: previous production runtime"
          node --version
          echo "G4 compatibility: current writer runtime"
          "$NODE24_BIN" --version
          echo "G4_OLD_READER_NODE_VERSION=$(node -p 'process.version')" >> "$GITHUB_ENV"
          echo "G4 compatibility: installing the baseline's own locked dependencies"
          (
            cd "$baseline"
            HUSKY=0 corepack yarn@1.22.22 install --frozen-lockfile
            echo "G4 compatibility: building the previous app on Node 20 without migrations"
            G4_TS_FIRST_PASS_ENABLED=true NEXTAUTH_URL=http://127.0.0.1:3015 \
              node node_modules/next/dist/bin/next build
          ) 2>&1 | tee "$RUNNER_TEMP/reader-layout/guided-state-baseline-build.log"
          echo "G4 compatibility: starting loopback writer and old reader"
          "$NODE24_BIN" node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3014 \
            > "$RUNNER_TEMP/reader-layout/guided-state-new-writer.log" 2>&1 &
          new_pid=$!
          old_pid=''
          trap 'kill "$new_pid"; if test -n "$old_pid"; then kill "$old_pid"; fi' EXIT
          (
            cd "$baseline"
            G4_TS_FIRST_PASS_ENABLED=true NEXTAUTH_URL=http://127.0.0.1:3015 \
              exec node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3015
          ) > "$RUNNER_TEMP/reader-layout/guided-state-old-reader.log" 2>&1 &
          old_pid=$!
          for port in 3014 3015; do
            ready=false
            for attempt in $(seq 1 30); do
              if curl --silent --fail "http://127.0.0.1:$port/courses/js-track/core-fundamentals/data-types" > /dev/null; then
                ready=true
                break
              fi
              sleep 2
            done
            test "$ready" = true
          done
          echo "G4 compatibility: checking shared synthetic progress history"
          G4_OLD_READER_NODE_VERSION="$(node -p 'process.version')" \
            "$NODE24_BIN" --import tsx src/scripts/check-guided-path-state.ts compat
        env:
          G4_OLD_READER_SHA: 191a0b9983b3f497480ad7dc33a6b8305393d32b
          G4_OLD_READER_FLAG_ENABLED: 'true'
          NEXT_PUBLIC_SITE_URL: https://memoized.dev
          MEILISEARCH_HOST: http://localhost:7700
          MEILISEARCH_MASTER_KEY: dummy-key-for-ci-build
          RESEND_TOKEN: re_dummy_key_for_ci_build
          NEXTAUTH_SECRET: dummy-nextauth-secret-for-ci
          NEXTAUTH_URL: http://127.0.0.1:3014
          NEXT_TELEMETRY_DISABLED: '1'
          SENTRY_DISABLE: true
          G4_TS_FIRST_PASS_ENABLED: 'true'
          READER_LAYOUT_FIXTURE: '1'
          # Placeholder for the publish refresh endpoint; not a real credential.
          REVALIDATE_SECRET: dummy-revalidate-secret-for-ci-000000000000
          READER_LAYOUT_REPORT_DIR: ${{ runner.temp }}/reader-layout

      - name: Upload reader layout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reader-layout
          path: ${{ runner.temp }}/reader-layout
          if-no-files-found: ignore
