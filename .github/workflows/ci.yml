name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn lint

      - name: Run type check
        run: yarn typecheck

      - name: Run tests
        run: yarn test:check
        env:
          RESEND_TOKEN: re_disabled_unit_test_key
          # Tests mock Prisma; a dummy URL keeps prod credentials out of PR CI.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/memoized_ci?schema=public

  build:
    name: Build Check
    runs-on: ubuntu-latest
    # An ephemeral Postgres, migrated fresh from the PR's own migrations. Build
    # Check must never run migrations against production — schema changes reach
    # prod only via the deploy workflow on merge to master.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: memoized_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/memoized_ci?schema=public
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/memoized_ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn generate

      - name: Prepare isolated reader layout fixtures
        run: |
          yarn migrate
          node --import tsx src/scripts/seed-reader-layout.ts
        env:
          READER_LAYOUT_FIXTURE: '1'
          READER_LAYOUT_REPORT_DIR: ${{ runner.temp }}/reader-layout

      - name: Build
        run: yarn build
        env:
          NEXT_PUBLIC_SITE_URL: https://memoized.dev
          MEILISEARCH_HOST: http://localhost:7700
          MEILISEARCH_MASTER_KEY: dummy-key-for-ci-build
          RESEND_TOKEN: re_dummy_key_for_ci_build
          NEXTAUTH_SECRET: dummy-nextauth-secret-for-ci
          NEXTAUTH_URL: https://memoized.dev
          SENTRY_DISABLE: true
          CI: true

      - name: Check real reader layout
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3014 > "$RUNNER_TEMP/reader-layout/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3014/courses/js-track/core-fundamentals/data-types > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          node --import tsx src/scripts/check-reader-layout.ts "$RUNNER_TEMP/reader-layout/config.json"
          node --import tsx src/scripts/check-guided-path.ts on
          node --import tsx src/scripts/check-guided-path-state.ts on
          node --import tsx src/scripts/check-lesson-rendering.ts on
          kill "$server_pid"
          if wait "$server_pid"; then
            :
          else
            exit_code=$?
            test "$exit_code" -eq 143
          fi
          G4_TS_FIRST_PASS_ENABLED=false node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3014 >> "$RUNNER_TEMP/reader-layout/server.log" 2>&1 &
          server_pid=$!
          ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3014/courses/js-track/core-fundamentals/data-types > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          node --import tsx src/scripts/check-guided-path.ts off
          node --import tsx src/scripts/check-lesson-rendering.ts off
        env:
          NEXT_PUBLIC_SITE_URL: https://memoized.dev
          MEILISEARCH_HOST: http://localhost:7700
          MEILISEARCH_MASTER_KEY: dummy-key-for-ci-build
          RESEND_TOKEN: re_dummy_key_for_ci_build
          NEXTAUTH_SECRET: dummy-nextauth-secret-for-ci
          NEXTAUTH_URL: http://127.0.0.1:3014
          SENTRY_DISABLE: true
          G4_TS_FIRST_PASS_ENABLED: 'true'
          READER_LAYOUT_FIXTURE: '1'
          READER_LAYOUT_REPORT_DIR: ${{ runner.temp }}/reader-layout

      # Opt in with this PR label before a new push. A second production
      # build is deliberately not charged to every ordinary PR.
      - name: Check pinned old reader against new writer (opt-in)
        if: contains(github.event.pull_request.labels.*.name, 'g4-old-reader')
        timeout-minutes: 20
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/g4-old-reader"
          echo "G4 compatibility: preparing pinned baseline"
          git fetch --no-tags origin "$G4_OLD_READER_SHA"
          git worktree add --detach "$baseline" "$G4_OLD_READER_SHA"
          test "$(git -C "$baseline" rev-parse HEAD)" = "$G4_OLD_READER_SHA"
          cmp yarn.lock "$baseline/yarn.lock"
          cmp prisma/schema.prisma "$baseline/prisma/schema.prisma"
          for name in .env .env.local .env.production .env.production.local prisma/.env; do
            test ! -e "$baseline/$name"
          done
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline/node_modules"
          echo "G4 compatibility: building pinned baseline without migrations"
          (
            cd "$baseline"
            G4_TS_FIRST_PASS_ENABLED=false NEXTAUTH_URL=http://127.0.0.1:3015 \
              node "$GITHUB_WORKSPACE/node_modules/next/dist/bin/next" build
          ) 2>&1 | tee "$RUNNER_TEMP/reader-layout/guided-state-baseline-build.log"
          echo "G4 compatibility: starting loopback writer and old reader"
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3014 \
            > "$RUNNER_TEMP/reader-layout/guided-state-new-writer.log" 2>&1 &
          new_pid=$!
          old_pid=''
          trap 'kill "$new_pid"; if test -n "$old_pid"; then kill "$old_pid"; fi' EXIT
          (
            cd "$baseline"
            G4_TS_FIRST_PASS_ENABLED=false NEXTAUTH_URL=http://127.0.0.1:3015 \
              exec node "$GITHUB_WORKSPACE/node_modules/next/dist/bin/next" start --hostname 127.0.0.1 --port 3015
          ) > "$RUNNER_TEMP/reader-layout/guided-state-old-reader.log" 2>&1 &
          old_pid=$!
          for port in 3014 3015; do
            ready=false
            for attempt in $(seq 1 30); do
              if curl --silent --fail "http://127.0.0.1:$port/courses/js-track/core-fundamentals/data-types" > /dev/null; then
                ready=true
                break
              fi
              sleep 2
            done
            test "$ready" = true
          done
          echo "G4 compatibility: checking shared synthetic progress history"
          node --import tsx src/scripts/check-guided-path-state.ts compat
        env:
          G4_OLD_READER_SHA: bb5d8143d289f3e835e58628be30c4345da2db2b
          NEXT_PUBLIC_SITE_URL: https://memoized.dev
          MEILISEARCH_HOST: http://localhost:7700
          MEILISEARCH_MASTER_KEY: dummy-key-for-ci-build
          RESEND_TOKEN: re_dummy_key_for_ci_build
          NEXTAUTH_SECRET: dummy-nextauth-secret-for-ci
          NEXTAUTH_URL: http://127.0.0.1:3014
          NEXT_TELEMETRY_DISABLED: '1'
          SENTRY_DISABLE: true
          G4_TS_FIRST_PASS_ENABLED: 'true'
          READER_LAYOUT_FIXTURE: '1'
          READER_LAYOUT_REPORT_DIR: ${{ runner.temp }}/reader-layout

      - name: Upload reader layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-layout
          path: ${{ runner.temp }}/reader-layout
          if-no-files-found: ignore
