name: Deploy Next.js app to Vercel

permissions:
  contents: read

env:
  COREPACK_ENABLE_AUTO_PIN: '0'

on:
  push:
    branches: [ master ]

concurrency:
  group: memoized-app-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: 'yarn'

      - name: Enable the declared package manager
        run: |
          corepack enable
          node --version
          corepack --version
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test:check        
        env:
          RESEND_TOKEN: re_disabled_unit_test_key
          DATABASE_URL: postgresql://ci:ci@localhost:5432/memoized_ci?schema=public
      
      - name: Run type check
        run: yarn typecheck

      - name: Install the pinned deployment CLI before loading production credentials
        run: |
          version=$(node .github/scripts/deploy-vercel.mjs --cli-version)
          npm install --prefix "$RUNNER_TEMP/vercel-cli" --no-package-lock --no-save --engine-strict "vercel@$version"
          node "$RUNNER_TEMP/vercel-cli/node_modules/vercel/dist/index.js" --version
        env:
          VERCEL_TELEMETRY_DISABLED: '1'
      
      - name: Run database migrations
        run: |
          node .github/scripts/verify-migration-target.mjs
          yarn migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Generate Prisma client
        run: yarn generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Sync blog posts to database
        run: yarn sync:blog
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      
      # Note: Content sync and MeiliSearch indexing are handled
      # by the private content repository's GitHub Actions workflow.
      # See: https://github.com/msiric/memoized-content
      
      - name: Deploy to Vercel
        run: node .github/scripts/deploy-vercel.mjs deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.PROJECT_ID }}
          VERCEL_CLI_ROOT: ${{ runner.temp }}/vercel-cli